<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="eh-logo-grad" x1="4" y1="4" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="eh-logo-glow" x1="12" y1="12" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Brand Icon Box -->
  <rect x="4" y="4" width="48" height="48" rx="13" fill="url(#eh-logo-grad)"/>
  <path d="M28 15L40 21.9V35.7L28 42.6L16 35.7V21.9L28 15Z" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <path d="M28 15V28.8M40 35.7L28 28.8M16 35.7L28 28.8" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
  <circle cx="28" cy="28.8" r="3" fill="#FFFFFF"/>
  <circle cx="28" cy="15" r="2.2" fill="url(#eh-logo-glow)"/>
  <circle cx="40" cy="21.9" r="2.2" fill="url(#eh-logo-glow)"/>
  <circle cx="40" cy="35.7" r="2.2" fill="url(#eh-logo-glow)"/>
  <circle cx="28" cy="42.6" r="2.2" fill="url(#eh-logo-glow)"/>
  <circle cx="16" cy="35.7" r="2.2" fill="url(#eh-logo-glow)"/>
  <circle cx="16" cy="21.9" r="2.2" fill="url(#eh-logo-glow)"/>
  
  <!-- Wordmark "EcomHub" -->
  <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">EcomHub</text>
  
  <!-- OS Badge -->
  <rect x="174" y="16" width="38" height="20" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="193" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="middle" letter-spacing="0.04em">OS</text>

  <!-- Tagline -->
  <text x="65" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0.02em">YOUR BUSINESS, ONE HUB.</text>
</svg>
